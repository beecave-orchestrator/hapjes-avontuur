<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Hapjes Avontuur kompas-hapje</title>
  <desc id="desc">Een vrolijk broodje in een kompaszon.</desc>
